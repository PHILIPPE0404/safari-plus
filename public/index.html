<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAFARI +</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="barre-navigation">
    <div class="logo">SAFARI <span>+</span></div>
    
    <form id="search-form" onsubmit="return false;">
      <input type="text" id="url-input" placeholder="Rechercher ou entrer une URL..." autocomplete="off">
      <button type="button" id="go-btn">Go</button>
    </form>
    
    <div id="progress-bar" class="progress-bar"></div>
  </header>

  <main class="conteneur-principal">
    <div id="search-results" class="results-container"></div>
    <iframe id="web-view" src="about:blank" style="display: none;"></iframe>
  </main>

  <script src="script.js"></script>
</body>
</html>
