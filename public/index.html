<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAFARI +</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="progress-container">
    <div id="progress-bar"></div>
  </div>

  <header class="browser-header">
    <div class="logo-title">
      <span class="brand-text">SAFARI <span class="plus">+</span></span>
    </div>
    <form id="search-form">
      <input type="text" id="search-input" placeholder="Rechercher sur le web ou entrer une URL..." required />
      <button type="submit">Go</button>
    </form>
  </header>

  <!-- Overlay de chargement avec animation infinie -->
  <div id="loader" class="hidden">
    <div class="loader-content">
      <div class="compass-logo">
        <div class="needle"></div>
      </div>
      <h2 class="infinite-text">SAFARI +</h2>
      <p>Chargement par le serveur...</p>
    </div>
  </div>

  <main id="content">
    <div id="results" class="results-container"></div>
    <iframe id="web-frame" class="hidden"></iframe>
  </main>

  <script src="app.js"></script>
</body>
</html>
