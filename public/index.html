<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAFARI +</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="barre-navigation">
    <div class="logo">SAFARI <span>+</span></div>
    
    <form id="search-form">
      <input type="text" id="url-input" placeholder="Rechercher ou entrer une URL..." autocomplete="off">
      <button type="submit">Go</button>
    </form>
    
    <!-- Barre d'animation de chargement -->
    <div id="progress-bar" class="progress-bar"></div>
  </header>

  <main class="conteneur-principal">
    <!-- Zone d'affichage des résultats de recherche -->
    <div id="search-results" class="results-container"></div>
    
    <!-- Iframe d'affichage des pages web (Proxy) -->
    <iframe id="web-view" src="about:blank" style="display: none;"></iframe>
  </main>

  <script src="script.js"></script>
</body>
</html>
